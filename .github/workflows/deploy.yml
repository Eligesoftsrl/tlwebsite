name: Build & Deploy with Pre-rendering

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libgtk-3-0

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build with pre-rendering
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
        run: yarn build:prerender

      - name: Verify pre-rendered HTML content
        working-directory: frontend/build
        run: |
          echo "=== Checking pre-rendered files ==="
          for dir in contatti piatti brigata matrimoni-autore-salerno; do
            if [ -f "$dir/index.html" ]; then
              CONTENT_LENGTH=$(wc -c < "$dir/index.html")
              echo "✅ $dir/index.html exists ($CONTENT_LENGTH bytes)"
              # Check if it has actual content (not just the SPA shell)
              if grep -q "noscript" "$dir/index.html" && ! grep -q "class=\"app\"" "$dir/index.html"; then
                echo "⚠️  WARNING: $dir/index.html may only contain SPA shell"
              else
                echo "   Content verified: has rendered HTML"
              fi
            else
              echo "❌ $dir/index.html NOT FOUND"
            fi
          done

      - name: Copy vercel.json to build directory
        run: cp frontend/vercel.json frontend/build/vercel.json

      - name: Link to Vercel project
        working-directory: frontend/build
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy pre-built site to Vercel
        working-directory: frontend/build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --token=$VERCEL_TOKEN --yes

name: Build & Deploy with Pre-rendering

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libgtk-3-0

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build with pre-rendering
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
        run: yarn build:prerender

      - name: Verify pre-rendered HTML content
        working-directory: frontend/build
        run: |
          echo "=== Checking pre-rendered files ==="
          for dir in contatti piatti brigata matrimoni-autore-salerno; do
            if [ -f "$dir/index.html" ]; then
              CONTENT_LENGTH=$(wc -c < "$dir/index.html")
              echo "✅ $dir/index.html exists ($CONTENT_LENGTH bytes)"
              # Check if it has actual content (not just the SPA shell)
              if grep -q "noscript" "$dir/index.html" && ! grep -q "class=\"app\"" "$dir/index.html"; then
                echo "⚠️  WARNING: $dir/index.html may only contain SPA shell"
              else
                echo "   Content verified: has rendered HTML"
              fi
            else
              echo "❌ $dir/index.html NOT FOUND"
            fi
          done

      - name: Copy vercel.json to build directory
        run: cp frontend/vercel.json frontend/build/vercel.json

      - name: Prepare Vercel prebuilt output
        working-directory: frontend/build
        run: |
          mkdir -p .vercel/output/static
          
          # Create Vercel output config with routing rules
          cat > .vercel/output/config.json << 'CONFIGEOF'
          {
            "version": 3,
            "cleanUrls": true,
            "trailingSlash": false,
            "routes": [
              {
                "src": "/api/contact",
                "dest": "/api/contact"
              },
              {
                "src": "/(.*)",
                "has": [{"type": "host", "value": "tenutaleone.it"}],
                "status": 308,
                "headers": {"Location": "https://www.tenutaleone.it/$1"}
              },
              {
                "src": "/index\\.html",
                "status": 308,
                "headers": {"Location": "https://www.tenutaleone.it/"}
              },
              {
                "src": "/(.*)",
                "headers": {
                  "X-Content-Type-Options": "nosniff",
                  "X-Frame-Options": "SAMEORIGIN",
                  "Referrer-Policy": "strict-origin-when-cross-origin"
                },
                "continue": true
              },
              {
                "src": "/static/(.*)",
                "headers": {"Cache-Control": "public, max-age=31536000, immutable"},
                "continue": true
              },
              {
                "src": "/img/(.*)",
                "headers": {"Cache-Control": "public, max-age=31536000, immutable"},
                "continue": true
              },
              {
                "handle": "filesystem"
              },
              {
                "src": "/(.*)",
                "dest": "/index.html"
              }
            ]
          }
          CONFIGEOF
          
          # Copy all build files to static output
          cp -r * .vercel/output/static/ 2>/dev/null || true
          # Remove the .vercel folder from static (avoid nesting)
          rm -rf .vercel/output/static/.vercel
          
          # Setup serverless function for /api/contact proxy
          mkdir -p .vercel/output/functions/api/contact.func
          cat > .vercel/output/functions/api/contact.func/index.js << 'FUNCEOF'
          exports.default = async function handler(req, res) {
            if (req.method !== 'POST') {
              return res.status(405).json({ error: 'Method not allowed' });
            }
            try {
              const response = await fetch('https://eliclient-production.up.railway.app/api/nuova_richiesta', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(req.body),
              });
              if (response.ok) {
                const data = await response.json().catch(() => ({}));
                return res.status(200).json({ success: true, data });
              } else {
                return res.status(response.status).json({ success: false, error: 'Errore dal server esterno' });
              }
            } catch (error) {
              return res.status(500).json({ success: false, error: 'Errore di connessione' });
            }
          };
          FUNCEOF
          cat > .vercel/output/functions/api/contact.func/.vc-config.json << 'VCEOF'
          {
            "runtime": "nodejs20.x",
            "handler": "index.js",
            "launcherType": "Nodejs"
          }
          VCEOF
          
          # Create project link
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json
          
          echo "=== Vercel output structure ==="
          ls -la .vercel/output/
          ls -la .vercel/output/static/ | head -20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy pre-built site to Vercel
        working-directory: frontend/build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --yes
